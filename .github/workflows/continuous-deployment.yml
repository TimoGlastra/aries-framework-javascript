name: Continuous Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  tag-version:
    runs-on: ubuntu-20.04
    name: Tag version
    if: "github.ref == 'refs/heads/main' && github.repository == 'TimoGlastra/aries-framework-javascript' && contains(github.event.head_commit.message, 'chore(release): v')"
    steps:
      - name: Checkout aries-framework-javascript
        uses: actions/checkout@v2

      - name: Get updated version
        id: new-version
        run: |
          NEW_VERSION=$(node -p "require('./lerna.json').version")
          echo $NEW_VERSION

          echo "::set-output name=version::$NEW_VERSION"

      - name: Create Tag
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: v${{ steps.new-version.outputs.version }}

  create-release:
    runs-on: ubuntu-20.04
    name: Create release
    if: "startsWith(github.ref, 'refs/tags/') && github.repository == 'TimoGlastra/aries-framework-javascript'"
    steps:
      - name: Checkout aries-framework-javascript
        uses: actions/checkout@v2

      # setup dependencies
      - name: Setup Libindy
        uses: ./.github/actions/setup-libindy

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create Release
        uses: softprops/action-gh-release@v1

      # # On push to main, release unstable version
