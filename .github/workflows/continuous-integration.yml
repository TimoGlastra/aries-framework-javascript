  release-stable:
    runs-on: ubuntu-20.04
    name: Release stable
    # needs: [integration-test, validate]
    if: github.ref == 'refs/heads/main' && github.repository == 'TimoGlastra/aries-framework-javascript' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout aries-framework-javascript
        uses: actions/checkout@v2
        with:
          # pulls all commits (needed for lerna to correctly version)
          fetch-depth: 0

      # setup dependencies
      - name: Setup Libindy
        uses: ./.github/actions/setup-libindy

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update version
        run: yarn lerna version --conventional-commits --no-git-tag-version --no-push --yes

      - name: Format lerna changes
        run: yarn format

      - name: Get updated version
        run: export NEW_VERSION=$(node -p "require('./lerna.json').version")

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: |
            chore(release): ${NEW_VERSION}
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: lerna-release
          signoff: true
          title: |
            chore(release): ${NEW_VERSION}
          body: |
            Release version ${NEW_VERSION}

